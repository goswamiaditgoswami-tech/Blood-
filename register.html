
<!DOCTYPE html>
<html>

<head>

    <title>Create Account - Blood Report Analysis</title>


    <style>

        /* Basic Page Settings */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background-color: #f5f8fa;
            color: #333;
        }


        /* Header */

        header {
            background-color: #c62828;
            color: white;

            padding: 20px 8%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        header h2 {
            font-size: 22px;
        }


        header a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }


        header a:hover {
            text-decoration: underline;
        }


        /* Registration Area */

        .register-container {
            min-height: 85vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }


        /* Registration Box */

        .register-box {
            width: 450px;

            background-color: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.12);
        }


        .register-box h1 {
            text-align: center;

            color: #b71c1c;

            margin-bottom: 10px;
        }


        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 30px;

            font-size: 15px;
        }


        /* Form Labels */

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            font-size: 15px;
        }


        /* Input Fields */

        input[type="text"],
        input[type="email"],
        input[type="password"] {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            margin-bottom: 18px;

            font-size: 15px;
        }


        input:focus {
            outline: none;

            border-color: #c62828;

            box-shadow: 0px 0px 4px rgba(198, 40, 40, 0.2);
        }


        /* Show Password */

        .show-password {
            display: flex;

            align-items: center;

            margin-top: -5px;

            margin-bottom: 20px;
        }


        .show-password input {
            width: auto;

            margin: 0 8px 0 0;

            cursor: pointer;
        }


        .show-password label {
            margin: 0;

            font-weight: normal;

            font-size: 14px;

            color: #555;

            cursor: pointer;
        }


        /* Create Account Button */

        .register-btn {

            width: 100%;

            padding: 13px;

            background-color: #c62828;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .register-btn:hover {
            background-color: #8e0000;

            transform: translateY(-2px);
        }


        /* Login Link */

        .login-link {
            text-align: center;

            margin-top: 25px;

            color: #666;

            font-size: 14px;
        }


        .login-link a {
            color: #c62828;

            text-decoration: none;

            font-weight: bold;
        }


        .login-link a:hover {
            text-decoration: underline;
        }


        /* Back to Home */

        .back-link {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #555;

            text-decoration: none;

            font-size: 14px;
        }


        .back-link:hover {
            color: #c62828;
        }


        /* Footer */

        footer {
            text-align: center;

            padding: 20px;

            background-color: #222;

            color: #ccc;

            font-size: 13px;
        }


        /* Mobile Screen */

        @media (max-width: 500px) {

            .register-box {
                width: 100%;

                padding: 30px 20px;
            }


            header {
                padding: 18px 20px;
            }


            header h2 {
                font-size: 18px;
            }

        }

    </style>

</head>



<body>


    <!-- Header -->

    <header>

        <h2>
            Blood Report Analysis
        </h2>


        <a href="/">
            Home
        </a>

    </header>



    <!-- Registration Section -->

    <div class="register-container">

        <div class="register-box">


            <h1>
                Create Account
            </h1>


            <p class="subtitle">
                Create an account to use the Blood Report Analysis System
            </p>



            <!-- Registration Form -->

            <form method="POST" action="/register">


                <!-- Full Name -->

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
		    name="name"
		 		
                    placeholder="Enter your full name"
                    required
                >



                <!-- Email -->

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
		    name="email"
                    placeholder="Enter your email address"
                    required
                >



                <!-- Password -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
		    name="password"
                    placeholder="Create a password"
                    required
                >



                <!-- Confirm Password -->

                <label for="confirm-password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
		    name="confirm_password"
                    placeholder="Enter your password again"
                    required
                >



                <!-- Show Password -->

                <div class="show-password">

                    <input
                        type="checkbox"
                        id="showPassword"
                        onclick="showPasswords()"
                    >

                    <label for="showPassword">
                        Show Password
                    </label>

                </div>



                <!-- Register Button -->

                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Account
                </button>


            </form>



            <!-- Login Link -->

            <p class="login-link">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>



            <!-- Home Link -->

            <a
                href="/"
                class="back-link"
            >
                ← Back to Home
            </a>


        </div>

    </div>



    <!-- Footer -->

    <footer>

        Blood Report Analysis System

    </footer>



    <!-- JavaScript -->

    <script>


        /* Show / Hide Password */

        function showPasswords() {

            var password =
                document.getElementById("password");

            var confirmPassword =
                document.getElementById("confirm-password");

            var checkbox =
                document.getElementById("showPassword");


            if (checkbox.checked) {

                password.type = "text";

                confirmPassword.type = "text";

            }

            else {

                password.type = "password";

                confirmPassword.type = "password";

            }

        }



        /* Registration Function */

        function registerUser(event) {

            event.preventDefault();


            var name =
                document.getElementById("name").value;

            var email =
                document.getElementById("email").value;

            var password =
                document.getElementById("password").value;

            var confirmPassword =
                document.getElementById("confirm-password").value;



            /* Check Password */

            if (password !== confirmPassword) {

                alert("Passwords do not match!");

                return;

            }



            /* Password Length */

            if (password.length < 6) {

                alert("Password must contain at least 6 characters!");

                return;

            }



            /*
                Backend and database will be connected here later.
            */

            alert(
                "Account created successfully!\n\n" +
                "Welcome " + name
            );


            /* Clear Form */

            document.querySelector("form").reset();

        }

    </script>


</body>

</html>
